/* Same look as src/general/demoing-features/assets/demo-template.html: white page, 980px grid, #f5f5f7 tiles. */
:root {
  color-scheme: light;
  --bg: #ffffff; --tile: #f5f5f7; --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #86868b; --line: #d2d2d7;
  --accent: #0071e3; --link: #0066cc; --flame: #bf4800;
  --full: #bf4800; --cached: #0071e3; /* per-call chart series; validated pair (dataviz validator, light) */
  --glass: rgba(255, 255, 255, .72);
  --grad: linear-gradient(90deg, #0090f7 0%, #ba62fc 38%, #f2416b 72%, #f55600 100%);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --w: 980px; --w-wide: 1180px; --r-lg: 28px; --r-md: 18px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.47 var(--sans); letter-spacing: -.022em; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; letter-spacing: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 3px; border-radius: 8px; }

.band { padding-block: clamp(64px, 10vw, 128px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: var(--w); margin: 0 auto; display: grid; gap: clamp(28px, 4vw, 48px); min-width: 0; }
.inner.wide { max-width: var(--w-wide); }
.eyebrow { font-size: clamp(17px, 1.6vw, 21px); font-weight: 600; letter-spacing: .004em; color: var(--flame); }
.h2 { font-size: clamp(36px, 5.6vw, 60px); line-height: 1.06; font-weight: 700; letter-spacing: -.035em; }
.h2 .quiet { color: var(--fg3); }
.head { display: grid; gap: 14px; }
.head.center { text-align: center; justify-items: center; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: var(--w); margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 20px; }
.nav-title { font-size: 21px; font-weight: 600; letter-spacing: .011em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav-links { margin-left: auto; display: flex; gap: 22px; font-size: 12px; }
.nav-links a { color: var(--fg); opacity: .8; }
.pill { border: 0; cursor: pointer; border-radius: 980px; background: var(--accent); color: #fff; font-size: 12px; padding: 5px 12px; white-space: nowrap; }
.pill:hover { background: #0077ed; text-decoration: none; }
@media (max-width: 760px) { .nav-links { display: none; } .nav-in .pill { margin-left: auto; } }

/* Hero */
.hero { text-align: center; padding-block: clamp(64px, 10vw, 128px) clamp(56px, 8vw, 96px); }
.hero .inner { justify-items: center; gap: 20px; }
.hero h1 { font-size: clamp(60px, 13vw, 132px); line-height: 1; font-weight: 700; letter-spacing: -.05em; font-variant-numeric: tabular-nums;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lede { font-size: clamp(24px, 3.2vw, 36px); line-height: 1.18; font-weight: 600; letter-spacing: -.03em; max-width: 24ch; }
.hero .lede .quiet { color: var(--fg3); }
.flag { display: inline-block; border-radius: 980px; padding: 6px 14px; font-size: 14px; font-weight: 600; background: var(--tile); color: var(--flame); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 24px clamp(20px, 4vw, 48px);
  margin-top: clamp(20px, 3vw, 36px); padding-top: clamp(24px, 4vw, 40px); border-top: 1px solid var(--line); width: 100%; }
.stat { display: grid; gap: 4px; justify-items: center; }
.stat b { font-size: clamp(30px, 4vw, 44px); font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--fg2); }
.stat small { font-size: 12px; color: var(--fg3); }
.meta { font-size: 14px; color: var(--fg3); }

/* Cards */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.card { background: var(--tile); border-radius: var(--r-lg); padding: clamp(24px, 3vw, 40px); display: grid; gap: 18px; align-content: start; min-width: 0; }
.card h3 { font-size: clamp(22px, 2.2vw, 28px); font-weight: 700; letter-spacing: -.028em; line-height: 1.14; }
.card .sub { color: var(--fg2); font-size: 15px; margin-top: -10px; }

/* Bars: where the tokens go (one hue, sorted, direct labels) */
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 30%) 1fr; gap: 6px 14px; align-items: center; }
.bar-row .lbl { font-size: 15px; font-weight: 500; }
.bar-row .val { grid-column: 2; font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.track { height: 12px; border-radius: 4px; background: #e8e8ed; overflow: hidden; }
.fill { height: 100%; border-radius: 4px; background: var(--fg); min-width: 2px; }

/* Per-call chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--fg2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .14); min-width: 150px; z-index: 5; transform: translate(-50%, -100%); white-space: nowrap; }
.tip b { display: block; font-size: 14px; margin-bottom: 2px; }
.tip .k { color: var(--fg2); }
.mini { display: flex; gap: 28px; flex-wrap: wrap; }
.mini div { display: grid; }
.mini b { font-size: 28px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.mini span { font-size: 13px; color: var(--fg2); }
.as-table summary { cursor: pointer; font-size: 14px; color: var(--link); list-style: none; }
.as-table summary::-webkit-details-marker { display: none; }
.as-table table { margin-top: 12px; width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.as-table th, .as-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.as-table th:first-child, .as-table td:first-child { text-align: left; }
.as-table .scroll { overflow-x: auto; }

/* Sketch */
.board { background: #fff; border-radius: var(--r-lg); overflow-x: auto; padding: clamp(12px, 2vw, 24px);
  border: 1px solid #e8e8ed; box-shadow: 0 1px 2px rgba(0, 0, 0, .03), 0 18px 50px rgba(0, 0, 0, .06); }
.board svg { display: block; width: 100%; min-width: 600px; height: auto; }
.caption { text-align: center; font-size: 17px; color: var(--fg2); max-width: 56ch; margin: 0 auto; }

/* Issues */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 980px; background: var(--tile); justify-self: center; max-width: 100%; }
.seg button { border: 0; background: none; cursor: pointer; border-radius: 980px; padding: 7px 16px; font-size: 14px; color: var(--fg2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); font-weight: 500; }
.bento { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); grid-auto-flow: dense; gap: 20px; }
.issue { background: var(--tile); border-radius: var(--r-lg); padding: clamp(26px, 3vw, 36px); display: grid; gap: 14px; align-content: start; min-width: 0; }
.issue .who { font-size: 14px; font-weight: 600; color: var(--flame); display: flex; gap: 10px; align-items: baseline; }
.issue .rank { font-variant-numeric: tabular-nums; color: var(--fg3); font-weight: 500; }
.issue h3 { font-size: clamp(22px, 2.2vw, 28px); line-height: 1.14; font-weight: 700; letter-spacing: -.028em; }
.waste b { font-size: clamp(30px, 3.4vw, 40px); font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.waste span { display: block; font-size: 14px; color: var(--fg2); margin-top: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12px; font-weight: 600; border-radius: 980px; padding: 4px 10px; background: var(--bg); color: var(--fg2); display: inline-flex; gap: 6px; align-items: center; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
.badge.high .dot { background: var(--flame); } .badge.medium .dot { background: #f5a623; }
.fixline { font-size: 17px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
.fixline::before { content: "→ "; color: var(--accent); }
.issue details { border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
.issue summary { cursor: pointer; font-size: 15px; color: var(--link); list-style: none; }
.issue summary::-webkit-details-marker { display: none; }
.issue summary::after { content: " +"; }
.issue details[open] summary::after { content: " −"; }
.ev { display: grid; gap: 14px; margin-top: 14px; }
.ev h4 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); }
.code { background: #fff; border-radius: 12px; border: 1px solid #e8e8ed; overflow: hidden; }
.code .file { font: 12px var(--mono); color: var(--fg2); padding: 8px 12px; border-bottom: 1px solid #e8e8ed; overflow-wrap: anywhere; }
.code pre, pre.diff { margin: 0; padding: 12px; font: 12.5px/1.5 var(--mono); overflow-x: auto; color: var(--fg); }
pre.diff { background: #fff; border-radius: 12px; border: 1px solid #e8e8ed; }
pre.diff .add { color: #0a7d38; } pre.diff .del { color: #b42318; }
.ev p { font-size: 15px; color: var(--fg2); }
@media (min-width: 760px) {
  .issue.feature { grid-column: span 2; padding: clamp(36px, 4.4vw, 52px);
    border: 2px solid transparent; background: linear-gradient(var(--tile), var(--tile)) padding-box, var(--grad) border-box; }
  .issue.feature h3 { font-size: clamp(30px, 3.4vw, 40px); letter-spacing: -.035em; }
  .issue.feature .waste b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: clamp(40px, 5vw, 60px); }
}
.empty { text-align: center; color: var(--fg2); font-size: 21px; }

/* Before / after */
.ba { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.ba-tile { border-radius: var(--r-lg); padding: clamp(28px, 4vw, 48px); display: grid; gap: 14px; align-content: start; background: var(--tile); }
.ba-tile.after { background: linear-gradient(#fff, #fff) padding-box, var(--grad) border-box; border: 2px solid transparent; }
.ba-tile h3 { font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--fg3); }
.ba-tile b { font-size: clamp(40px, 6vw, 64px); font-weight: 700; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
.ba-tile .money { font-size: 19px; font-weight: 600; color: var(--fg2); }
.ba-tile ul { margin: 6px 0 0; padding-left: 1.1em; color: var(--fg2); display: grid; gap: 6px; font-size: 15px; }

/* Method */
.faq { border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 24px; align-items: center;
  padding: 22px 0; font-size: clamp(19px, 2vw, 22px); font-weight: 600; letter-spacing: -.02em; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 28px; font-weight: 300; color: var(--fg3); transition: transform .3s ease; flex: none; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq .body { padding: 0 0 24px; color: var(--fg2); display: grid; gap: 8px; }
.faq ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

.foot { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.foot .inner { border-top: 1px solid var(--line); padding-top: 18px; font-size: 12px; color: var(--fg3); gap: 6px; }
.foot a { overflow-wrap: anywhere; }

@keyframes rise { from { opacity: .2; transform: translateY(28px) scale(.985); } }
@keyframes land { from { opacity: .35; transform: translateY(14px); } }
@media (prefers-reduced-motion: no-preference) {
  .hero .inner > * { animation: land .9s cubic-bezier(.2, .7, .2, 1) both; }
  @supports (animation-timeline: view()) { .reveal { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 55%; } }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .faq summary::after { transition: none; } }
</style>

      const a = nodes[e.from], b = nodes[e.to]; if (!a || !b) return;
      const [x1, y1] = anchor(a, b), [x2, y2] = anchor(b, a);
      const lo = Object.assign({}, opt, e.dashed ? { strokeLineDash: [8, 8] } : {});
      const ang = Math.atan2(y2 - y1, x2 - x1), L = 14;
      const h1 = [x2 - L * Math.cos(ang - .45), y2 - L * Math.sin(ang - .45)], h2 = [x2 - L * Math.cos(ang + .45), y2 - L * Math.sin(ang + .45)];
      if (rc) { svg.append(rc.line(x1, y1, x2, y2, lo), rc.line(x2, y2, ...h1, opt), rc.line(x2, y2, ...h2, opt)); }
      else { svg.append(s("line", { x1, y1, x2, y2, stroke: ink, "stroke-width": 2, "stroke-dasharray": e.dashed ? "8 8" : "none" }),
        s("polyline", { points: [h1, [x2, y2], h2].join(" "), fill: "none", stroke: ink, "stroke-width": 2 })); }
      if (e.label) {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = e.label.length * 8 + 14;
        svg.append(s("rect", { x: mx - w / 2, y: my - 13, width: w, height: 26, rx: 6, fill }), text(mx, my, e.label, 15));
      }
    });
    all.forEach(x => {
      svg.append(shape(x), text(x.x + x.w / 2, x.y + x.h / 2, x.label, 18, 700));
      if (x.hot) {
        const cx = x.x + x.w / 2, cy = x.y + x.h / 2;
        svg.append(rc ? rc.ellipse(cx, cy, x.w + 44, x.h + 40, { stroke: flame, strokeWidth: 2.2, roughness: 1.8, seed: 3 })
          : s("ellipse", { cx, cy, rx: x.w / 2 + 22, ry: x.h / 2 + 20, fill: "none", stroke: flame, "stroke-width": 2.2 }));
        // Below the node: arrows mostly enter from the sides and above, so the label stays clear of them.
        svg.append(text(cx, x.y + x.h + 40, typeof x.hot === "string" ? x.hot : "hot spot", 15, 700, flame));
      }
    });
    return svg;
  }
})();
</script>
