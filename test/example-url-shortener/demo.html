/* Layout: Apple product-page rhythm on a white page only. 980px reading grid, #f5f5f7 tiles, generous white space between bands. */

  --stage: #ffffff; --stage-fg: #1d1d1f; --stage-fg2: #6e6e73; --stage-tile: #f5f5f7;
  --glass: rgba(255, 255, 255, .72); --hud: rgba(29, 29, 31, .86);

body { background: var(--bg); color: var(--fg); font: 17px/1.47 var(--sans); letter-spacing: -.022em;
  -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; letter-spacing: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; }

:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 3px; border-radius: 8px; }

.band { padding-block: clamp(72px, 11vw, 140px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band.alt { background: var(--alt); }
.band.stage { background: var(--stage); color: var(--stage-fg); }
.inner { max-width: var(--w); margin: 0 auto; display: grid; gap: clamp(28px, 4vw, 48px); min-width: 0; }

.eyebrow { font-size: clamp(17px, 1.6vw, 21px); font-weight: 600; letter-spacing: .004em; color: var(--flame); }
.h2 { font-size: clamp(36px, 5.6vw, 60px); line-height: 1.06; font-weight: 700; letter-spacing: -.035em; }
.h2 .quiet { color: var(--fg3); }
.stage .h2 .quiet { color: var(--stage-fg2); }
.sub { font-size: clamp(19px, 2.1vw, 24px); line-height: 1.33; font-weight: 500; letter-spacing: -.02em; color: var(--fg2); max-width: 40ch; }
.head { display: grid; gap: 14px; }
.head.center { text-align: center; justify-items: center; }

/* Local nav */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: var(--w); margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 20px; }
.nav-title { font-size: 21px; font-weight: 600; letter-spacing: .011em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav-links { margin-left: auto; display: flex; gap: 22px; font-size: 12px; letter-spacing: -.01em; }
.nav-links a { color: var(--fg); opacity: .8; }
.nav-links a:hover { opacity: 1; text-decoration: none; }
.pill { border: 0; cursor: pointer; border-radius: 980px; background: var(--accent); color: #fff; font-size: 12px; padding: 5px 12px; white-space: nowrap; }
.pill:hover { background: #0077ed; }
.pill.lg { font-size: 17px; padding: 12px 24px; }
.more { font-size: 17px; color: var(--link); background: none; border: 0; cursor: pointer; padding: 12px 4px; }
.more::after { content: " \203A"; }
@media (max-width: 760px) { .nav-links { display: none; } .nav-in .pill { margin-left: auto; } }

/* Hero */
.hero { text-align: center; padding-block: clamp(64px, 10vw, 128px) clamp(56px, 8vw, 96px); }
.hero .inner { justify-items: center; gap: 22px; }
.hero h1 { font-size: clamp(52px, 10vw, 104px); line-height: 1.02; font-weight: 700; letter-spacing: -.045em; max-width: 12ch; }
.hero .lede { font-size: clamp(21px, 2.6vw, 30px); line-height: 1.24; font-weight: 600; letter-spacing: -.025em; max-width: 30ch; }
.ctas { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: center; align-items: center; margin-top: 6px; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px clamp(28px, 6vw, 72px); margin-top: clamp(24px, 4vw, 44px);
  padding-top: clamp(24px, 4vw, 40px); border-top: 1px solid var(--line); width: 100%; }
.stat { display: grid; gap: 2px; }
.stat b { font-size: clamp(36px, 5vw, 56px); font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { font-size: 14px; color: var(--fg2); letter-spacing: -.01em; }
.meta { font-size: 14px; color: var(--fg3); }

/* Before / after */
.ba { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.ba-tile { border-radius: var(--r-lg); padding: clamp(28px, 4vw, 48px); display: grid; gap: 22px; align-content: start; min-width: 0; }
.ba-tile.before { background: var(--tile-a); }
.ba-tile.after { background: var(--invert-bg); color: var(--invert-fg); border: 2px solid transparent;
  background: linear-gradient(#fff, #fff) padding-box, var(--grad) border-box; }
.ba-tile h3 { font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--fg3); }
.ba-tile.after h3 { color: var(--invert-fg2); }
.ba-tile ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.ba-tile li { font-size: clamp(19px, 2vw, 23px); line-height: 1.3; font-weight: 600; letter-spacing: -.02em; }
.ba-tile.before li { color: var(--fg2); }

/* Sketch */
.board { background: var(--sketch-paper); border-radius: var(--r-lg); overflow-x: auto; padding: clamp(12px, 2vw, 24px);
  border: 1px solid #e8e8ed; box-shadow: 0 1px 2px rgba(0, 0, 0, .03), 0 18px 50px rgba(0, 0, 0, .06); }
.board svg { display: block; width: 100%; min-width: 600px; height: auto; }
.caption { text-align: center; font-size: 17px; color: var(--fg2); max-width: 52ch; margin: 0 auto; }

/* Use cases: bento */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 980px; background: var(--tile-a); justify-self: center; max-width: 100%; }
.seg button { border: 0; background: none; cursor: pointer; border-radius: 980px; padding: 7px 16px; font-size: 14px; color: var(--fg2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); font-weight: 500; }
.bento { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); grid-auto-flow: dense; gap: 20px; }
.uc { background: var(--tile-a); border-radius: var(--r-lg); padding: clamp(26px, 3vw, 36px); display: grid; gap: 14px; align-content: start; min-width: 0; }
.uc .who { font-size: 14px; font-weight: 600; color: var(--flame); letter-spacing: -.01em; display: flex; gap: 10px; align-items: baseline; }
.uc .rank { font-variant-numeric: tabular-nums; color: var(--fg3); font-weight: 500; }
.uc h3 { font-size: clamp(22px, 2.2vw, 28px); line-height: 1.14; font-weight: 700; letter-spacing: -.028em; }
.uc .situation { color: var(--fg2); }
.uc .do { font-size: 15px; color: var(--fg); }
.uc .do b { font-weight: 600; }
.uc .result { font-size: 19px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
.uc .result::before { content: "→ "; color: var(--accent); }
.uc .without { font-size: 14px; color: var(--fg3); padding-top: 14px; border-top: 1px solid var(--line); margin-top: auto; }
@media (min-width: 700px) {
  .uc.feature { grid-column: span 2; padding: clamp(36px, 4.4vw, 56px); gap: 18px; }
  .uc.feature h3 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -.035em; }
  .uc.feature .result { font-size: clamp(21px, 2.2vw, 26px); }
}

/* Stage: ways to explain */
.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border-radius: 980px; background: var(--stage-tile); justify-self: center; max-width: 100%; }
.tabs button { border: 0; background: none; cursor: pointer; border-radius: 980px; padding: 8px 18px; font-size: 14px; color: var(--stage-fg2); }
.tabs button[aria-selected="true"] { background: var(--stage-fg); color: var(--stage); font-weight: 500; }
.quote { text-align: center; display: grid; gap: 28px; justify-items: center; min-height: 12em; align-content: center; }
.quote p { font-size: clamp(26px, 3.6vw, 42px); line-height: 1.16; font-weight: 600; letter-spacing: -.03em; max-width: 26ch; }
.quote .copy { border: 1px solid var(--line); background: none; color: var(--stage-fg2); border-radius: 980px; padding: 6px 16px; font-size: 14px; cursor: pointer; }
.quote .copy:hover { color: var(--stage-fg); border-color: var(--stage-fg2); }

/* Script */
.script { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: clamp(20px, 3vw, 40px); align-items: start; }
@media (max-width: 820px) { .script { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 20px; position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); }
@media (max-width: 820px) { .side { position: static; } }
.hook { background: var(--tile-b); border-radius: var(--r-lg); padding: 28px; font-size: 21px; line-height: 1.3; font-weight: 600; letter-spacing: -.02em; }
.hook small { display: block; font-size: 14px; font-weight: 600; color: var(--flame); margin-bottom: 10px; letter-spacing: -.01em; }
.prep { background: var(--tile-b); border-radius: var(--r-lg); padding: 28px; display: grid; gap: 14px; }
.prep h3 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }

.prep input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step { background: var(--tile-b); border-radius: var(--r-md); padding: 22px 26px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; }
.step .t { font-size: 21px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--fg3); }
.step .d { font-size: 19px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
.step .s { margin-top: 8px; color: var(--fg2); font-size: 16px; }

.step.wow { border: 2px solid transparent; background: linear-gradient(var(--tile-b), var(--tile-b)) padding-box, var(--grad) border-box; }
.step.wow .t { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wow-tag { display: inline-block; margin-left: 10px; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; vertical-align: 3px; }
.step.now { box-shadow: 0 0 0 3px var(--accent); }
@media (max-width: 480px) { .step { grid-template-columns: 1fr; gap: 6px; } }

/* Q&A */
.faq { border-top: 1px solid var(--line); }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 24px; align-items: center;

.faq summary::-webkit-details-marker { display: none; }

.limits { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }

.foot ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.foot code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.foot a { overflow-wrap: anywhere; }

/* Present mode */
.hud { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(680px, calc(100% - 32px));
  background: var(--hud); color: #f5f5f7; -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  border-radius: 22px; padding: 12px 12px 12px 22px; display: flex; align-items: center; gap: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.hud-clock { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; flex: none; }
.hud-clock small { font-size: 13px; color: #a1a1a6; font-weight: 500; margin-left: 4px; }
.hud-now { min-width: 0; flex: 1; font-size: 14px; line-height: 1.3; }
.hud-now span { display: block; color: #a1a1a6; font-size: 12px; }
.hud-now b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-btns { display: flex; gap: 6px; flex: none; }
.hud-btns button { border: 0; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .14); color: #f5f5f7; font-size: 16px; }
.hud-btns button:hover { background: rgba(255, 255, 255, .24); }
.hud-btns .x { width: auto; padding: 0 14px; border-radius: 980px; font-size: 13px; }
body.presenting .band { min-height: calc(100vh - 52px); display: grid; align-content: center; }
@media (max-width: 520px) { .hud-now { display: none; } }

/* Motion: scroll-driven reveal; everything is fully visible at rest and without support. */
@keyframes rise { from { opacity: .2; transform: translateY(32px) scale(.985); } }
@keyframes land { from { opacity: .35; transform: translateY(14px); } }
@media (prefers-reduced-motion: no-preference) {
  .hero .inner > * { animation: land .9s cubic-bezier(.2, .7, .2, 1) both; }
  .hero .inner > *:nth-child(2) { animation-delay: .06s; } .hero .inner > *:nth-child(3) { animation-delay: .12s; }
  .hero .inner > *:nth-child(4) { animation-delay: .18s; } .hero .inner > *:nth-child(5) { animation-delay: .24s; }
  @supports (animation-timeline: view()) {
    .reveal { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 55%; }
  }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .faq summary::after { transition: none; } }
</style>

<script>

  // Hero

  function filter(g) {

    let first = true;

  }
  app.append(band("uses", "wide",
    head("What people use it for", d.useCases.length + " ways to use it.", "Ranked by how often people reach for it.", true),
    groups.length > 1 ? h("div", { class: "seg", role: "group", "aria-label": "Filter by who uses it" }, segBtns) : null,

  let current = 0;

  function pick(i) {

  tablist.addEventListener("keydown", e => {

    if (e.key === "ArrowRight") { pick((current + 1) % n); tabBtns[current].focus(); e.preventDefault(); }
    if (e.key === "ArrowLeft") { pick((current - 1 + n) % n); tabBtns[current].focus(); e.preventDefault(); }
  });
  copyBtn.addEventListener("click", () => {
    const text = d.explanations[current].text;
    const done = () => { copyBtn.textContent = "Copied"; };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(quoteP); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent = "Selected, press Copy"; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }

    head("Pick the framing for your room", "Ways to explain it.", "Same feature, different story.", true),

  // Demo script

  const prep = h("div", { class: "prep" }, h("h3", null, "Before you start"),
    d.script.setup.map((s, i) => {
      const box = h("input", { type: "checkbox", id: "prep-" + i, checked: saved.includes(String(i)) });
      box.addEventListener("change", () => store.set(key, [...prep.querySelectorAll("input")].map((b, j) => b.checked ? j : "").filter(String).join(",")));

    h("div", { class: "t" }, s.time),
    h("div", null, h("div", { class: "d" }, s.do, s.wow ? h("span", { class: "wow-tag" }, "The moment") : null), h("p", { class: "s" }, s.say))));
  app.append(band("script", "alt",
    head("Run of show", "The demo, step by step.", d.demoLength ? "About " + d.demoLength + "." : null),
    h("div", { class: "script" },
      h("div", { class: "side" }, d.script.hook ? h("div", { class: "hook" }, h("small", null, "Open with"), d.script.hook) : null, prep),
      h("ol", { class: "steps" }, stepEls))));

  // Q&A
  app.append(band("qa", "",
    head("Be ready for", "Questions people will ask.", null),
    h("div", { class: "faq reveal" }, d.questions.map(x => h("details", null, h("summary", null, x.q), h("p", null, x.a))))));

  // Limits
  const noIcon = () => { const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke-width", "1.6"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>'; return s; };

    head("Say it before they do", "What it is not for.", null),
    h("ul", { class: "limits" }, d.notFor.map(t => h("li", { class: "reveal" }, noIcon(), h("span", null, t))))));

  // Sources
  if (d.sources && d.sources.length) {
    app.append(h("footer", { class: "foot" }, h("div", { class: "inner" }, h("div", null, "Checked against"),
      h("ol", null, d.sources.map(s => h("li", null, /^https?:\/\//.test(s) ? h("a", { href: s, target: "_blank", rel: "noopener" }, s) : h("code", null, s)))))));
  }

  // Present mode: arrow keys step through sections; the HUD shows the clock and what to do now.
  let presenting = false, t0 = 0, tick = null, hud = null;
  const toSec = t => { const m = String(t).match(/(\d+):(\d{2})/); return m ? +m[1] * 60 + +m[2] : 0; };
  const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  function togglePresent() { presenting ? stopPresent() : startPresent(); }
  function startPresent() {
    presenting = true; document.body.classList.add("presenting"); t0 = Date.now();
    const clock = h("div", { class: "hud-clock" }, "0:00");
    const now = h("div", { class: "hud-now" });

      let i = 0; steps.forEach((s, j) => { if (toSec(s.time) <= el) i = j; });

      now.replaceChildren(h("span", null, next ? "Now · next at " + next.time : "Now · last step"), h("b", null, steps[i].do));
    };
    update(); tick = setInterval(update, 1000);
    try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    window.scrollTo({ top: 0 });
  }
  function stopPresent() {
    presenting = false; document.body.classList.remove("presenting"); clearInterval(tick);
    if (hud) hud.remove(); hud = null; stepEls.forEach(e => e.classList.remove("now"));
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  }
  function go(dir) {
    const secs = [...document.querySelectorAll("header.band, section.band")];
    const y = window.scrollY + 80;
    let idx = 0; secs.forEach((s, i) => { if (s.offsetTop <= y) idx = i; });

  // Hand-drawn journey: same {nodes, edges} spec as designing-software-architecture's diagrams. Black ink on white.
  function drawFlow(spec) {
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue("--sketch-ink").trim() || "#1d1d1f";
    const fill = css.getPropertyValue("--sketch-fill").trim() || "#ffffff";
    const pad = 36;
    const nodes = {}; spec.nodes.forEach(n => { nodes[n.id] = Object.assign({ w: 160, h: 70, shape: "rectangle" }, n); });
    const all = Object.values(nodes);
    const minX = Math.min(...all.map(n => n.x)) - pad, minY = Math.min(...all.map(n => n.y)) - pad;
    const maxX = Math.max(...all.map(n => n.x + n.w)) + pad, maxY = Math.max(...all.map(n => n.y + n.h)) + pad;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
    svg.setAttribute("role", "img");

    const opt = { stroke: ink, strokeWidth: 1.7, roughness: 1.15, bowing: .9, fill, fillStyle: "solid", seed: 7 };
    const plain = (tag, attrs) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
    const shape = n => {
      const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
      if (n.shape === "ellipse") return rc ? rc.ellipse(cx, cy, n.w, n.h, opt) : plain("ellipse", { cx, cy, rx: n.w / 2, ry: n.h / 2, fill, stroke: ink, "stroke-width": 2 });
      if (n.shape === "diamond") { const pts = [[cx, n.y], [n.x + n.w, cy], [cx, n.y + n.h], [n.x, cy]];
        return rc ? rc.polygon(pts, opt) : plain("polygon", { points: pts.join(" "), fill, stroke: ink, "stroke-width": 2 }); }
      return rc ? rc.rectangle(n.x, n.y, n.w, n.h, opt) : plain("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10, fill, stroke: ink, "stroke-width": 2 });
    };
    const anchor = (n, o) => {
      const dx = (o.x + o.w / 2) - (n.x + n.w / 2), dy = (o.y + o.h / 2) - (n.y + n.h / 2);
      if (Math.abs(dx) >= Math.abs(dy)) return [n.x + (dx > 0 ? n.w : 0), n.y + n.h / 2];
      return [n.x + n.w / 2, n.y + (dy > 0 ? n.h : 0)];
    };
    const text = (x, y, str, size, weight) => {
      const lines = String(str).split("\n");
      const t = plain("text", { x, y: y - (lines.length - 1) * size * 0.6, "text-anchor": "middle", "dominant-baseline": "middle",
        "font-family": "Kalam, 'Bradley Hand', 'Comic Sans MS', cursive", "font-size": size, "font-weight": weight || 400, fill: ink });
      lines.forEach((ln, i) => { const ts = plain("tspan", { x, dy: i ? size * 1.2 : 0 }); ts.textContent = ln; t.appendChild(ts); });
      return t;
    };
    (spec.edges || []).forEach(e => {
      const a = nodes[e.from], b = nodes[e.to]; if (!a || !b) return;
      const [x1, y1] = anchor(a, b), [x2, y2] = anchor(b, a);
      const lo = Object.assign({}, opt, e.dashed ? { strokeLineDash: [8, 8] } : {});
      const ang = Math.atan2(y2 - y1, x2 - x1), L = 14;
      const h1 = [x2 - L * Math.cos(ang - .45), y2 - L * Math.sin(ang - .45)];
      const h2 = [x2 - L * Math.cos(ang + .45), y2 - L * Math.sin(ang + .45)];
      if (rc) { svg.appendChild(rc.line(x1, y1, x2, y2, lo)); svg.appendChild(rc.line(x2, y2, ...h1, opt)); svg.appendChild(rc.line(x2, y2, ...h2, opt)); }
      else {
        svg.appendChild(plain("line", { x1, y1, x2, y2, stroke: ink, "stroke-width": 2, "stroke-dasharray": e.dashed ? "8 8" : "none" }));
        svg.appendChild(plain("polyline", { points: [h1, [x2, y2], h2].join(" "), fill: "none", stroke: ink, "stroke-width": 2 }));
      }
      if (e.label) {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = e.label.length * 8 + 14;
        svg.appendChild(plain("rect", { x: mx - w / 2, y: my - 13, width: w, height: 26, rx: 6, fill }));
        svg.appendChild(text(mx, my, e.label, 15));

    });

    return svg;
  }
