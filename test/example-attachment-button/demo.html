/* Local nav */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); }

.nav-in { max-width: var(--w); margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 20px; }
.nav-title { font-size: 21px; font-weight: 600; letter-spacing: .011em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.pill { border: 0; cursor: pointer; border-radius: 980px; background: var(--accent); color: #fff; font-size: 12px; padding: 5px 12px; white-space: nowrap; }

/* Hero */
.hero { text-align: center; padding-block: clamp(64px, 10vw, 128px) clamp(56px, 8vw, 96px); }
.hero .inner { justify-items: center; gap: 22px; }
.hero h1 { font-size: clamp(52px, 10vw, 104px); line-height: 1.02; font-weight: 700; letter-spacing: -.045em; max-width: 12ch; }
.hero .lede { font-size: clamp(21px, 2.6vw, 30px); line-height: 1.24; font-weight: 600; letter-spacing: -.025em; max-width: 30ch; }
.ctas { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: center; align-items: center; margin-top: 6px; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px clamp(28px, 6vw, 72px); margin-top: clamp(24px, 4vw, 44px);

.stat span { font-size: 14px; color: var(--fg2); letter-spacing: -.01em; }

/* Before / after */
.ba { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.ba-tile { border-radius: var(--r-lg); padding: clamp(28px, 4vw, 48px); display: grid; gap: 22px; align-content: start; min-width: 0; }
.ba-tile.before { background: var(--tile-a); }
.ba-tile.after { background: var(--invert-bg); color: var(--invert-fg); border: 2px solid transparent;
  background: linear-gradient(#fff, #fff) padding-box, var(--grad) border-box; }
.ba-tile h3 { font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--fg3); }
.ba-tile.after h3 { color: var(--invert-fg2); }
.ba-tile ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.ba-tile li { font-size: clamp(19px, 2vw, 23px); line-height: 1.3; font-weight: 600; letter-spacing: -.02em; }
.ba-tile.before li { color: var(--fg2); }

/* Sketch */
.board { background: var(--sketch-paper); border-radius: var(--r-lg); overflow-x: auto; padding: clamp(12px, 2vw, 24px);

.board svg { display: block; width: 100%; min-width: 600px; height: auto; }
.caption { text-align: center; font-size: 17px; color: var(--fg2); max-width: 52ch; margin: 0 auto; }

/* Use cases: bento */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 980px; background: var(--tile-a); justify-self: center; max-width: 100%; }
.seg button { border: 0; background: none; cursor: pointer; border-radius: 980px; padding: 7px 16px; font-size: 14px; color: var(--fg2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); font-weight: 500; }
.bento { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); grid-auto-flow: dense; gap: 20px; }
.uc { background: var(--tile-a); border-radius: var(--r-lg); padding: clamp(26px, 3vw, 36px); display: grid; gap: 14px; align-content: start; min-width: 0; }
.uc .who { font-size: 14px; font-weight: 600; color: var(--flame); letter-spacing: -.01em; display: flex; gap: 10px; align-items: baseline; }
.uc .rank { font-variant-numeric: tabular-nums; color: var(--fg3); font-weight: 500; }
.uc h3 { font-size: clamp(22px, 2.2vw, 28px); line-height: 1.14; font-weight: 700; letter-spacing: -.028em; }
.uc .situation { color: var(--fg2); }
.uc .do { font-size: 15px; color: var(--fg); }
.uc .do b { font-weight: 600; }
.uc .result { font-size: 19px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
.uc .result::before { content: "→ "; color: var(--accent); }
.uc .without { font-size: 14px; color: var(--fg3); padding-top: 14px; border-top: 1px solid var(--line); margin-top: auto; }
@media (min-width: 700px) {
  .uc.feature { grid-column: span 2; padding: clamp(36px, 4.4vw, 56px); gap: 18px; }
  .uc.feature h3 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -.035em; }
  .uc.feature .result { font-size: clamp(21px, 2.2vw, 26px); }
}

/* Stage: ways to explain */
.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border-radius: 980px; background: var(--stage-tile); justify-self: center; max-width: 100%; }
.tabs button { border: 0; background: none; cursor: pointer; border-radius: 980px; padding: 8px 18px; font-size: 14px; color: var(--stage-fg2); }
.tabs button[aria-selected="true"] { background: var(--stage-fg); color: var(--stage); font-weight: 500; }
.quote { text-align: center; display: grid; gap: 28px; justify-items: center; min-height: 12em; align-content: center; }
.quote p { font-size: clamp(26px, 3.6vw, 42px); line-height: 1.16; font-weight: 600; letter-spacing: -.03em; max-width: 26ch; }

.quote .copy:hover { color: var(--stage-fg); border-color: var(--stage-fg2); }

/* Script */

/* Present mode */
.hud { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(680px, calc(100% - 32px));

/* Motion: scroll-driven reveal; everything is fully visible at rest and without support. */
@keyframes rise { from { opacity: .2; transform: translateY(32px) scale(.985); } }

  @supports (animation-timeline: view()) {

  }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .faq summary::after { transition: none; } }

      const ang = Math.atan2(y2 - y1, x2 - x1), L = 14;
      const h1 = [x2 - L * Math.cos(ang - .45), y2 - L * Math.sin(ang - .45)];
      const h2 = [x2 - L * Math.cos(ang + .45), y2 - L * Math.sin(ang + .45)];
      if (rc) { svg.appendChild(rc.line(x1, y1, x2, y2, lo)); svg.appendChild(rc.line(x2, y2, ...h1, opt)); svg.appendChild(rc.line(x2, y2, ...h2, opt)); }
      else {
        svg.appendChild(plain("line", { x1, y1, x2, y2, stroke: ink, "stroke-width": 2, "stroke-dasharray": e.dashed ? "8 8" : "none" }));
        svg.appendChild(plain("polyline", { points: [h1, [x2, y2], h2].join(" "), fill: "none", stroke: ink, "stroke-width": 2 }));
      }
      if (e.label) {
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, w = e.label.length * 8 + 14;
        svg.appendChild(plain("rect", { x: mx - w / 2, y: my - 13, width: w, height: 26, rx: 6, fill }));
        svg.appendChild(text(mx, my, e.label, 15));
      }
    });
    all.forEach(n => { svg.appendChild(shape(n)); svg.appendChild(text(n.x + n.w / 2, n.y + n.h / 2, n.label, 18, 700)); });
    return svg;
  }
})();
