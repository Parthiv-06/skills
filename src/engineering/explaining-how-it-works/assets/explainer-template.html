<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Same design system as demoing-features' template: white page, 980px grid, #f5f5f7 tiles, blue pills. */
:root {
  color-scheme: light;
  --bg: #ffffff; --tile: #f5f5f7; --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #86868b; --line: #d2d2d7;
  --accent: #0071e3; --link: #0066cc; --flame: #bf4800; --glass: rgba(255, 255, 255, .72);
  --grad: linear-gradient(90deg, #0090f7 0%, #ba62fc 38%, #f2416b 72%, #f55600 100%);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --w: 980px; --w-wide: 1240px; --r-lg: 28px; --r-md: 18px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.47 var(--sans); letter-spacing: -.022em; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; letter-spacing: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: .86em var(--mono); background: var(--tile); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 3px; border-radius: 8px; }

.band { padding-block: clamp(64px, 10vw, 120px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band.tight { padding-top: 0; }
.inner { max-width: var(--w); margin: 0 auto; display: grid; gap: clamp(26px, 4vw, 44px); min-width: 0; }
.inner.wide { max-width: var(--w-wide); }
.eyebrow { font-size: clamp(17px, 1.6vw, 21px); font-weight: 600; color: var(--flame); }
.h2 { font-size: clamp(34px, 5.4vw, 58px); line-height: 1.06; font-weight: 700; letter-spacing: -.035em; }
.h2 .quiet { color: var(--fg3); }
.h3 { font-size: clamp(26px, 3vw, 34px); line-height: 1.12; font-weight: 700; letter-spacing: -.03em; }
.head { display: grid; gap: 14px; }
.head.center { text-align: center; justify-items: center; }
.lead { font-size: clamp(19px, 2vw, 23px); line-height: 1.4; color: var(--fg2); max-width: 62ch; }
.part { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--glass); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: var(--w); margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 20px; }
.nav-title { font-size: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav-links { margin-left: auto; display: flex; gap: 22px; font-size: 12px; }
.nav-links a { color: var(--fg); opacity: .8; }
.pill { border: 0; cursor: pointer; border-radius: 980px; background: var(--accent); color: #fff; font-size: 12px; padding: 5px 12px; white-space: nowrap; }
.pill:hover { background: #0077ed; text-decoration: none; }
.pill.lg { font-size: 17px; padding: 12px 24px; }
.more { font-size: 17px; color: var(--link); background: none; border: 0; cursor: pointer; padding: 12px 4px; }
.more::after { content: " \203A"; }
@media (max-width: 760px) { .nav-links { display: none; } .nav-in .pill { margin-left: auto; } }

/* Hero */
.hero { text-align: center; padding-block: clamp(64px, 10vw, 128px) clamp(48px, 7vw, 88px); }
.hero .inner { justify-items: center; gap: 20px; }
.hero h1 { font-size: clamp(46px, 8.4vw, 92px); line-height: 1.03; font-weight: 700; letter-spacing: -.045em; max-width: 16ch; }
.hero .lede { font-size: clamp(21px, 2.6vw, 30px); line-height: 1.26; font-weight: 600; letter-spacing: -.025em; max-width: 34ch; }
.scope { font-size: 15px; color: var(--fg2); max-width: 60ch; }
.scope b { color: var(--fg); font-weight: 600; }
.ctas { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: center; align-items: center; }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px clamp(28px, 6vw, 64px); margin-top: clamp(16px, 3vw, 32px);
  padding-top: clamp(24px, 4vw, 36px); border-top: 1px solid var(--line); width: 100%; }
.stat { display: grid; gap: 2px; }
.stat b { font-size: clamp(34px, 4.6vw, 52px); font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { font-size: 14px; color: var(--fg2); }

/* Part 1: plain steps */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.pstep { background: var(--tile); border-radius: var(--r-lg); padding: clamp(24px, 3vw, 36px); display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 22px; }
.pstep .n { font-size: clamp(40px, 5vw, 56px); font-weight: 700; letter-spacing: -.05em; line-height: 1; color: var(--fg3); font-variant-numeric: tabular-nums; }
.pstep h3 { font-size: clamp(22px, 2.4vw, 28px); line-height: 1.16; font-weight: 700; letter-spacing: -.028em; margin-bottom: 14px; }
.pstep .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px 28px; }
.pstep .cols h4 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); margin-bottom: 4px; }
.pstep .cols p { font-size: 17px; }
.pstep .jump { margin-top: 14px; font-size: 14px; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }
.pstep .jump::after { content: " \203A"; }
@media (max-width: 560px) { .pstep { grid-template-columns: 1fr; } }
.side3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.card { background: var(--tile); border-radius: var(--r-lg); padding: clamp(24px, 3vw, 36px); display: grid; gap: 14px; align-content: start; min-width: 0; }
.card h3 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.card ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; color: var(--fg); }
.card.glow { background: linear-gradient(var(--tile), var(--tile)) padding-box, var(--grad) border-box; border: 2px solid transparent; }
.card.glow p { font-size: 21px; line-height: 1.35; font-weight: 600; letter-spacing: -.02em; }
.terms { display: grid; gap: 10px; margin: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0 0 6px; color: var(--fg2); }

/* Part 2 */
.summary { font-size: clamp(19px, 2vw, 22px); line-height: 1.5; max-width: 70ch; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 980px; background: var(--tile); justify-self: center; max-width: 100%; }
.seg button { border: 0; background: none; cursor: pointer; border-radius: 980px; padding: 7px 16px; font-size: 14px; color: var(--fg2); white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); font-weight: 500; }
.board { background: #fff; border-radius: var(--r-lg); border: 1px solid #e8e8ed; box-shadow: 0 1px 2px rgba(0, 0, 0, .03), 0 18px 50px rgba(0, 0, 0, .06);
  overflow: auto; padding: clamp(10px, 2vw, 22px); }
.board svg { display: block; width: 100%; min-width: 860px; height: auto; }
.board:fullscreen { border-radius: 0; padding: 32px; display: grid; place-items: center; }
.board:fullscreen svg { max-height: calc(100vh - 64px); width: auto; max-width: 100%; min-width: 0; }
.dbar { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; align-items: center; }
.dbar p { color: var(--fg2); font-size: 16px; max-width: 70ch; }
.ghost { border: 1px solid var(--line); background: none; border-radius: 980px; padding: 6px 14px; font-size: 14px; cursor: pointer; color: var(--fg); white-space: nowrap; }
.ghost:hover { border-color: var(--fg3); }

.tablewrap { overflow-x: auto; border-radius: var(--r-md); border: 1px solid #e8e8ed; }
table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 760px; }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg3); padding: 12px 14px; background: var(--tile); }
td { padding: 12px 14px; border-top: 1px solid #e8e8ed; vertical-align: top; }
tr.hl td { background: #eef5ff; }
.badge { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 13px; background: var(--fg); color: #fff; font-size: 12px; font-weight: 700; padding: 0 6px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 980px; padding: 3px 9px; background: var(--tile); color: var(--fg2); white-space: nowrap; }
.chip.inferred { color: var(--flame); }
.where { font: 12.5px var(--mono); color: var(--fg2); overflow-wrap: anywhere; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.ext h3 { font-size: 24px; letter-spacing: -.025em; }
.ext dl { margin: 0; display: grid; grid-template-columns: minmax(96px, 30%) 1fr; gap: 10px 16px; font-size: 15px; }
.ext dt { color: var(--fg3); font-weight: 600; font-size: 13px; padding-top: 2px; }
.ext dd { margin: 0; }
.bento { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }

.foot { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.foot .inner { border-top: 1px solid var(--line); padding-top: 18px; font-size: 12px; color: var(--fg3); gap: 8px; }
.foot ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.foot code { font-size: 12px; background: none; padding: 0; }

@keyframes land { from { opacity: .35; transform: translateY(14px); } }
@keyframes rise { from { opacity: .2; transform: translateY(28px) scale(.985); } }
@media (prefers-reduced-motion: no-preference) {
  .hero .inner > * { animation: land .9s cubic-bezier(.2, .7, .2, 1) both; }
  @supports (animation-timeline: view()) { .reveal { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 50%; } }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

<div id="app"></div>

<!-- Filled by scripts/build_explainer.py. Schema: "Explainer JSON" in SKILL.md. Diagrams arrive as finished SVG. -->
<script id="explainer-data" type="application/json">
{{EXPLAINER_JSON}}
</script>

<script>
(function () {
  const d = JSON.parse(document.getElementById("explainer-data").textContent);
  const app = document.getElementById("app");
  const NAMES = { context: "Context", containers: "Containers", components: "Components", sequence: "Sequence", state: "State", data: "Data", deployment: "Deployment" };

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k);
    return el;
  }
  const band = (id, cls, ...kids) => h("section", { id, class: "band " + (cls || "") }, h("div", { class: "inner" + (/\bwide\b/.test(cls || "") ? " wide" : "") }, ...kids));
  const head = (eyebrow, loud, quiet, center) => h("div", { class: "head reveal" + (center ? " center" : "") },
    eyebrow ? h("div", { class: "eyebrow" }, eyebrow) : null, h("h2", { class: "h2" }, loud, quiet ? h("span", { class: "quiet" }, " " + quiet) : null));
  const codeish = s => { // `backticks` in text become <code>
    const out = []; String(s || "").split(/(`[^`]+`)/).forEach(p => out.push(/^`.*`$/.test(p) ? h("code", null, p.slice(1, -1)) : p)); return out; };
  const list = items => h("ul", null, (items || []).map(t => h("li", null, codeish(t))));
  const P = d.plain, steps = P.steps, ext = d.external || [];
  const files = new Set((d.trace || []).map(t => String(t.where || "").split(":")[0]).filter(Boolean));

  // Nav
  const links = [["Plain English", "plain"], ["Diagrams", "diagrams"], ["Trace", "trace"], ext.length ? ["External", "external"] : null,
    ["Failures", "failures"], ["Debug", "debug"]].filter(Boolean);
  app.append(h("nav", { class: "nav", "aria-label": "Sections" }, h("div", { class: "nav-in" },
    h("div", { class: "nav-title" }, d.subject),
    h("div", { class: "nav-links" }, links.map(([t, id]) => h("a", { href: "#" + id }, t))),
    h("a", { class: "pill", href: "#tech" }, "Under the hood"))));

  // Hero
  app.append(h("header", { class: "band hero" }, h("div", { class: "inner" },
    h("div", { class: "eyebrow" }, "How it works"),
    h("h1", null, d.subject),
    h("p", { class: "lede" }, d.answer),
    h("p", { class: "scope" }, "From ", h("b", null, d.scope.start), " to ", h("b", null, d.scope.end), "."),
    h("div", { class: "ctas" },
      h("a", { class: "pill lg", href: "#plain" }, "Start simple"),
      h("a", { class: "more", href: "#tech" }, "Go straight to the technical view")),
    h("div", { class: "stats" },
      h("div", { class: "stat" }, h("b", null, String(steps.length)), h("span", null, "steps")),
      h("div", { class: "stat" }, h("b", null, String(d.diagrams.length)), h("span", null, "diagrams")),
      h("div", { class: "stat" }, h("b", null, String(ext.length)), h("span", null, "external services")),
      h("div", { class: "stat" }, h("b", null, String(files.size)), h("span", null, "files traced"))))));

  // Part 1
  app.append(band("plain", "",
    h("span", { class: "part" }, "Part 1"),
    head("In plain English", "The whole thing in " + steps.length + " steps.", "No jargon.", false),
    h("ol", { class: "steps" }, steps.map(s => h("li", { class: "pstep reveal" },
      h("div", { class: "n" }, s.n),
      h("div", null,
        h("h3", null, s.title),
        h("div", { class: "cols" },
          h("div", null, h("h4", null, "What you see"), h("p", null, s.see)),
          h("div", null, h("h4", null, "Behind the scenes"), h("p", null, s.behind))),
        h("button", { class: "jump", type: "button", onclick: () => jump(s.tech) }, "Technical steps " + s.tech.join(", "))))))));
  const extras = [];
  if (P.analogy) extras.push(h("div", { class: "card glow reveal" }, h("h3", null, "Think of it like this"), h("p", null, P.analogy)));
  if (P.worth && P.worth.length) extras.push(h("div", { class: "card reveal" }, h("h3", null, "Worth knowing"), list(P.worth)));
  if (P.terms && P.terms.length) extras.push(h("div", { class: "card reveal" }, h("h3", null, "Words used above"),
    h("dl", { class: "terms" }, P.terms.map(t => [h("dt", null, t.term), h("dd", null, t.plain)]))));
  if (extras.length) app.append(band("plain-more", "tight", h("div", { class: "side3" }, extras)));

  // Part 2: summary + diagrams
  app.append(band("tech", "",
    h("span", { class: "part" }, "Part 2"),
    head("Under the hood", "How it really works.", "Every hop, with evidence.", false),
    h("p", { class: "summary reveal" }, codeish(d.summary))));

  const board = h("div", { class: "board reveal", role: "tabpanel" });
  const cap = h("p", null);
  let cur = 0;
  const tabs = d.diagrams.map((g, i) => h("button", { type: "button", role: "tab", "aria-selected": "false", onclick: () => show(i) }, NAMES[g.view] || g.view));
  function show(i) {
    cur = i; board.innerHTML = d.diagrams[i].svg; cap.textContent = d.diagrams[i].caption;
    tabs.forEach((b, j) => { b.setAttribute("aria-selected", String(i === j)); b.tabIndex = i === j ? 0 : -1; });
  }
  const tablist = h("div", { class: "seg", role: "tablist", "aria-label": "Diagram level" }, tabs);
  tablist.addEventListener("keydown", e => {
    const n = tabs.length;
    if (e.key === "ArrowRight") { show((cur + 1) % n); tabs[cur].focus(); e.preventDefault(); }
    if (e.key === "ArrowLeft") { show((cur - 1 + n) % n); tabs[cur].focus(); e.preventDefault(); }
  });
  const full = h("button", { class: "ghost", type: "button", onclick: () => { try { board.requestFullscreen && board.requestFullscreen().catch(() => {}); } catch (e) {} } }, "Full screen");
  app.append(band("diagrams", "wide",
    head("Architecture", d.diagrams.length + " views.", "From the big picture down to each call.", true),
    tablist, board, h("div", { class: "dbar" }, cap, full)));
  show(0);

  // Trace
  const rows = d.trace.map(t => h("tr", { "data-step": String(t.step) },
    h("td", null, h("span", { class: "badge" }, String(t.step))),
    h("td", null, h("b", null, t.from), " → ", h("b", null, t.to)),
    h("td", null, codeish(t.how)),
    h("td", null, codeish(t.data)),
    h("td", null, t.where ? h("span", { class: "where" }, t.where) : "–", " ", h("span", { class: "chip " + t.status }, t.status))));
  app.append(band("trace", "wide",
    head("Step by step", "The trace.", "Numbers match the diagrams.", false),
    h("div", { class: "tablewrap reveal" }, h("table", null,
      h("thead", null, h("tr", null, ["Step", "From → To", "How", "What travels", "Where"].map(c => h("th", null, c)))), h("tbody", null, rows)))));
  function jump(stepsList) {
    rows.forEach(r => r.classList.toggle("hl", stepsList.map(String).includes(r.dataset.step)));
    document.getElementById("trace").scrollIntoView();
  }

  // External services
  if (ext.length) {
    const F = [["Purpose", "purpose"], ["Interface", "interface"], ["Auth", "auth"], ["Sends", "sends"], ["Limits", "limits"], ["Calls back", "callbacks"], ["When it's down", "whenDown"]];
    app.append(band("external", "", head("Outside our code", ext.length === 1 ? "1 external service." : ext.length + " external services.", null, false),
      h("div", { class: "grid2" }, ext.map(c => h("article", { class: "card ext reveal" }, h("h3", null, c.name),
        h("dl", null, F.filter(([, k]) => c[k]).map(([lbl, k]) => [h("dt", null, lbl), h("dd", null, codeish(c[k]))]),
          h("dt", null, "Evidence"), h("dd", null, (c.evidence || []).map(e => h("div", { class: "where" }, e)))))))));
  }

  // Data
  if (d.data && d.data.length) {
    app.append(band("data", "", head("State", "Data it touches.", null, false),
      h("div", { class: "tablewrap reveal" }, h("table", null,
        h("thead", null, h("tr", null, ["Store", "Reads", "Writes", "Notes"].map(c => h("th", null, c)))),
        h("tbody", null, d.data.map(x => h("tr", null, h("td", null, h("b", null, x.store)), h("td", null, codeish(x.reads)), h("td", null, codeish(x.writes)), h("td", null, codeish(x.notes)))))))));
  }

  // Failures
  app.append(band("failures", "", head("When things go wrong", "Failure modes.", null, false),
    h("div", { class: "tablewrap reveal" }, h("table", null,
      h("thead", null, h("tr", null, ["What fails", "What the user sees", "What the code does", "Where"].map(c => h("th", null, c)))),
      h("tbody", null, d.failures.map(f => h("tr", null, h("td", null, h("b", null, f.what)), h("td", null, codeish(f.userSees)), h("td", null, codeish(f.codeDoes)),
        h("td", null, f.where ? h("span", { class: "where" }, f.where) : "–"))))))));

  // Everything else, as cards
  const sections = [["Timing and async", d.timing], ["Security and trust", d.security], ["Performance and limits", d.performance],
    ["Open questions", d.open], ["Noticed along the way", d.noticed]].filter(([, v]) => v && v.length);
  if (d.config && d.config.length) sections.push(["Config and flags", d.config.map(c => "`" + c.name + "`: " + c.effect + (c.where ? " (" + c.where + ")" : ""))]);
  app.append(band("debug", "wide", head("Working with it", "Debug, config, and the rest.", null, false),
    h("div", { class: "bento" },
      d.debug && d.debug.length ? h("div", { class: "card glow reveal" }, h("h3", null, "How to debug it"), list(d.debug)) : null,
      sections.map(([t, v]) => h("div", { class: "card reveal" }, h("h3", null, t), list(v))))));

  app.append(h("footer", { class: "foot" }, h("div", { class: "inner" }, h("div", null, "Read while tracing"),
    h("ol", null, d.sources.map(s => h("li", null, /^https?:\/\//.test(s) ? h("a", { href: s, target: "_blank", rel: "noopener" }, s) : h("code", null, s)))),
    d.diagramFiles ? h("div", null, "Editable diagrams: ", h("code", null, d.diagramFiles), " (open in excalidraw.com, ☰ → Open)") : null)));
})();
</script>
